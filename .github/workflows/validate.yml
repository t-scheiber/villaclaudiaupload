name: Validate booking document workflows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: |
          php -l villa-claudia-docs/villa-claudia-docs.php
          php -l villa-claudia-docs/workflow.php
          php -l cron-document-reminders.php
          php tests/wordpress-workflow.php villa-claudia-docs/workflow.php
