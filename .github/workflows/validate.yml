name: Validate booking document workflows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: |
          php -l villa-claudia-docs/villa-claudia-docs.php
          php -l villa-claudia-docs/workflow.php
          php -l villa-claudia-docs/copy-privacy.php
          php -l cron-document-reminders.php
          php -l cron-privacy-retention.php
          php -l villa-claudia-privacy/villa-claudia-privacy.php
          php -l scripts/publish-privacy.php
          php -l rates-display-plugin/villa-claudia-rates-display.php
          php -l restaurant-posts-zigzag/restaurant-posts-zigzag.php
          php -l scripts/staging-guard.php
          php tests/wordpress-workflow.php villa-claudia-docs/workflow.php
          php tests/wordpress-copy-privacy.php villa-claudia-docs/workflow.php
          php tests/wordpress-calendar.php villa-claudia-docs/villa-claudia-docs.php
          php tests/wordpress-forwarding.php villa-claudia-docs/workflow.php
          php tests/wordpress-rates.php rates-display-plugin/villa-claudia-rates-display.php
          php tests/wordpress-upload.php
          php tests/staging-guard.php
          php tests/wordpress-privacy.php
